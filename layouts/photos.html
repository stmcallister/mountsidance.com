{{ define "main" }}
<div class="msd-layout msd-layout-wide">
  <article class="msd-content post-single">
    {{ partial "page_header.html" . }}

    {{- with .Content }}
    <div class="post-content md-content">{{ . }}</div>
    {{- end }}

    {{- with .Params.gallery }}
    <section class="msd-gallery" aria-label="Performance photos">
      {{- range . }}
      <figure>
        {{ partial "photo.html" (dict "src" .src "alt" .alt) }}
        {{- with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}
      </figure>
      {{- end }}
    </section>
    {{- end }}
  </article>
</div>
{{ end }}
