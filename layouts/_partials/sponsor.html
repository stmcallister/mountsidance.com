{{- /* Sponsor card body. The logo shows once its file exists in static/; until then, just the name. */}}
{{- with .logo }}{{ if fileExists (printf "static%s" .) }}
<img class="msd-sponsor-logo" src="{{ . | relURL }}" alt="{{ $.name }}" loading="lazy" />
{{- end }}{{ end }}
<strong>{{ .name }}</strong>
